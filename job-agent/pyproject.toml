[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobagent"
version = "0.1.0"
description = "Personal job application agent: find, score, tailor for, and semi-autofill job applications."
requires-python = ">=3.10"

[project.scripts]
jobagent = "jobagent.cli:main"

[tool.setuptools]
packages = ["jobagent", "jobagent.sources", "jobagent.autofill"]
